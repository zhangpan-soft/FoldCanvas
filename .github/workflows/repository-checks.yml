name: Repository checks

on:
  push:
  pull_request:

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable GitHub Action pins
        run: |
          python3 Scripts/validate_action_pins.py
          python3 Scripts/test_action_pins.py
      - name: Validate JSON and architecture boundaries
        run: python3 Scripts/validate_repository.py
      - name: Validate deterministic release archive
        run: python3 Scripts/test_release_package.py
      - name: Validate immutable RC2 release-candidate contract
        run: python3 Scripts/test_release_candidate.py
      - name: Validate M17 stable release contract
        run: python3 Scripts/test_stable_release.py
      - name: Validate exact M16-to-M17 readiness evidence
        run: python3 Scripts/test_stable_readiness.py
      - name: Validate M15 public release verifier
        run: python3 Scripts/test_public_release.py
      - name: Validate M15 source-first upgrade proof
        run: python3 Scripts/test_upgrade_proof.py
      - name: Validate M15 stable-release exit gate
        run: python3 Scripts/test_stable_exit.py
      - name: Validate M16 active candidate control
        run: python3 Scripts/test_active_candidate.py
      - name: Validate M16 candidate soak aggregation
        run: python3 Scripts/test_candidate_soak.py
      - name: Validate M16 reviewed release-gate ledger
        run: python3 Scripts/test_release_gate_ledger.py
      - name: Validate fork contribution trust boundary
        run: python3 Scripts/test_trusted_contribution_gate.py
      - name: Validate M11 clean-install project and evidence contracts
        run: python3 Scripts/test_clean_install_project.py

      - name: Validate M12 production handoff project and evidence contracts
        run: python3 Scripts/test_handoff_proof.py
