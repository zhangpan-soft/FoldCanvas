name: Package release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable tag to publish after a failed tag run
        required: false
        type: string
  pull_request:
  push:
    tags:
      - "v*-rc.*"
      - "v1.0.0"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build-package:
    name: Deterministic UPM package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate manual stable-release recovery request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v1.0.0" ]]; then
            echo "::error::Manual release recovery only accepts immutable v1.0.0."
            exit 1
          fi

      - name: Validate repository
        run: python3 Scripts/validate_repository.py

      - name: Validate deterministic release archive
        run: python3 Scripts/test_release_package.py

      - name: Validate current release-candidate contract
        run: python3 Scripts/test_release_candidate.py

      - name: Validate stable release contract
        run: python3 Scripts/test_stable_release.py

      - name: Validate exact stable readiness evidence
        run: python3 Scripts/test_stable_readiness.py

      - name: Validate M15 public release verifier
        run: python3 Scripts/test_public_release.py

      - name: Validate M15 source-first upgrade proof
        run: python3 Scripts/test_upgrade_proof.py

      - name: Validate M15 stable-release exit gate
        run: python3 Scripts/test_stable_exit.py

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_args=(--tag "$RELEASE_TAG")
          fi
          python3 Scripts/build_release_package.py \
            --output artifacts/package "${tag_args[@]}"

      - name: Upload package and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foldcanvas-upm-release-candidate
          path: |
            artifacts/package/*.tgz
            artifacts/package/*.sha256
            artifacts/package/*.manifest.json
            artifacts/package/*.evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish exact reviewed tag
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v1.0.0')
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download validated release-candidate bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: foldcanvas-upm-release-candidate
          path: artifacts/package

      - name: Revalidate exact M16 readiness before stable publication
        if: env.RELEASE_TAG == 'v1.0.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_root="artifacts/m17-stable-readiness"
          mkdir -p "$output_root/download"
          run_id="$(
            jq -r '.stableQualification.workflowRunId' \
              Documentation~/m17-stable-release.json
          )"
          artifact_id="$(
            jq -r '.stableQualification.artifactId' \
              Documentation~/m17-stable-release.json
          )"
          artifact_name="$(
            jq -r '.stableQualification.artifactName' \
              Documentation~/m17-stable-release.json
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$output_root/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$output_root/artifact.json"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$output_root/download"
          report_path="$output_root/download/report.json"
          test -f "$report_path"
          python3 Scripts/validate_stable_readiness.py \
            --report "$report_path" \
            --run-metadata "$output_root/run.json" \
            --artifact-metadata "$output_root/artifact.json" \
            --output "$output_root/verification.json"

      - name: Publish matching reviewed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          elif [[ "$RELEASE_TAG" != "v1.0.0" ]]; then
            echo "::error::Unsupported FoldCanvas release tag."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/package/*.tgz \
            artifacts/package/*.sha256 \
            artifacts/package/*.manifest.json \
            artifacts/package/*.evidence.json \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FoldCanvas $RELEASE_TAG"

      - name: Dispatch public release qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run public-release-qualification.yml \
            --ref "$RELEASE_TAG" \
            --field release_tag="$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"
