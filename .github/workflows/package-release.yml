name: Package release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable tag to publish after a failed tag run
        required: false
        type: string
  pull_request:
  push:
    tags:
      - "v*-rc.*"
      - "v1.0.0"
      - "v1.0.1"
      - "v1.1.0"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build-package:
    name: Deterministic UPM package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate manual stable-release recovery request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v1.0.0" && "$RELEASE_TAG" != "v1.0.1" && "$RELEASE_TAG" != "v1.1.0" ]]; then
            echo "::error::Manual release recovery only accepts immutable v1.0.0, v1.0.1, or v1.1.0."
            exit 1
          fi

      - name: Validate repository
        run: python3 Scripts/validate_repository.py

      - name: Validate deterministic release archive
        run: python3 Scripts/test_release_package.py

      - name: Validate immutable release identities and minor contract
        if: env.RELEASE_TAG == '' || env.RELEASE_TAG == 'v1.1.0'
        run: |
          python3 Scripts/validate_public_release_identities.py
          python3 Scripts/test_minor_release.py
          python3 Scripts/test_minor_release_authorization.py

      - name: Validate current release-candidate contract
        run: python3 Scripts/test_release_candidate.py

      - name: Validate stable release contract
        run: python3 Scripts/test_stable_release.py

      - name: Validate exact stable readiness evidence
        run: python3 Scripts/test_stable_readiness.py

      - name: Validate M15 public release verifier
        run: python3 Scripts/test_public_release.py

      - name: Validate M15 source-first upgrade proof
        run: python3 Scripts/test_upgrade_proof.py

      - name: Validate M15 stable-release exit gate
        run: python3 Scripts/test_stable_exit.py

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_args=(--tag "$RELEASE_TAG")
          fi
          python3 Scripts/build_release_package.py \
            --output artifacts/package "${tag_args[@]}"

      - name: Upload package and digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foldcanvas-upm-release-candidate
          path: |
            artifacts/package/*.tgz
            artifacts/package/*.sha256
            artifacts/package/*.manifest.json
            artifacts/package/*.evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish exact reviewed tag
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.release_tag == 'v1.0.0' || inputs.release_tag == 'v1.0.1' || inputs.release_tag == 'v1.1.0'))
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download validated release-candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foldcanvas-upm-release-candidate
          path: artifacts/package

      - name: Require one annotated tag on protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(jq -r '.version' package.json)"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"

      - name: Verify exact-head patch release authorization
        if: env.RELEASE_TAG == 'v1.0.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_root="artifacts/m23-release-authorization"
          mkdir -p "$output_root"
          tag_commit="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit/pulls" \
            > "$output_root/pull-requests.json"
          pull_number="$(jq -er 'if length == 1 then .[0].number else error("expected one PR") end' "$output_root/pull-requests.json")"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$pull_number/comments?per_page=100" \
            | jq 'add' > "$output_root/comments.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tag_commit&per_page=100" \
            | jq '{workflow_runs: [.[].workflow_runs[]]}' \
            > "$output_root/workflow-runs.json"
          gh api -X GET search/issues \
            -f q="repo:$GITHUB_REPOSITORY is:issue is:open label:release-blocker" \
            > "$output_root/release-blockers.json"
          python3 Scripts/verify_patch_release_authorization.py \
            --contract Documentation~/m23-patch-release.json \
            --pull-requests "$output_root/pull-requests.json" \
            --comments "$output_root/comments.json" \
            --workflow-runs "$output_root/workflow-runs.json" \
            --blockers "$output_root/release-blockers.json" \
            --repository "$GITHUB_REPOSITORY" \
            --maintainer "${GITHUB_REPOSITORY_OWNER}" \
            --tag "$RELEASE_TAG" \
            --tag-commit "$tag_commit" \
            --output "$output_root/report.json"

      - name: Verify exact-head minor release authorization
        if: env.RELEASE_TAG == 'v1.1.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_root="artifacts/m25-release-authorization"
          mkdir -p "$output_root"
          tag_commit="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit/pulls" \
            > "$output_root/pull-requests.json"
          pull_number="$(jq -er 'if length == 1 then .[0].number else error("expected one PR") end' "$output_root/pull-requests.json")"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$pull_number/comments?per_page=100" \
            | jq 'add' > "$output_root/comments.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tag_commit&per_page=100" \
            | jq '{workflow_runs: [.[].workflow_runs[]]}' \
            > "$output_root/workflow-runs.json"
          gh api -X GET search/issues \
            -f q="repo:$GITHUB_REPOSITORY is:issue is:open label:release-blocker" \
            > "$output_root/release-blockers.json"
          python3 Scripts/verify_minor_release_authorization.py \
            --contract Documentation~/m25-minor-release.json \
            --pull-requests "$output_root/pull-requests.json" \
            --comments "$output_root/comments.json" \
            --workflow-runs "$output_root/workflow-runs.json" \
            --blockers "$output_root/release-blockers.json" \
            --repository "$GITHUB_REPOSITORY" \
            --maintainer "${GITHUB_REPOSITORY_OWNER}" \
            --tag "$RELEASE_TAG" \
            --tag-commit "$tag_commit" \
            --output "$output_root/report.json"

      - name: Revalidate exact M16 readiness before stable publication
        if: env.RELEASE_TAG == 'v1.0.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_root="artifacts/m17-stable-readiness"
          mkdir -p "$output_root/download"
          run_id="$(
            jq -r '.stableQualification.workflowRunId' \
              Documentation~/m17-stable-release.json
          )"
          artifact_id="$(
            jq -r '.stableQualification.artifactId' \
              Documentation~/m17-stable-release.json
          )"
          artifact_name="$(
            jq -r '.stableQualification.artifactName' \
              Documentation~/m17-stable-release.json
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$output_root/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$output_root/artifact.json"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$output_root/download"
          report_path="$output_root/download/report.json"
          test -f "$report_path"
          python3 Scripts/validate_stable_readiness.py \
            --report "$report_path" \
            --run-metadata "$output_root/run.json" \
            --artifact-metadata "$output_root/artifact.json" \
            --output "$output_root/verification.json"

      - name: Publish matching reviewed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          elif [[ "$RELEASE_TAG" != "v1.0.0" && "$RELEASE_TAG" != "v1.0.1" && "$RELEASE_TAG" != "v1.1.0" ]]; then
            echo "::error::Unsupported FoldCanvas release tag."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/package/*.tgz \
            artifacts/package/*.sha256 \
            artifacts/package/*.manifest.json \
            artifacts/package/*.evidence.json \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FoldCanvas $RELEASE_TAG"

      - name: Dispatch public release qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run public-release-qualification.yml \
            --ref "$RELEASE_TAG" \
            --field release_tag="$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload patch release authorization
        if: always() && env.RELEASE_TAG == 'v1.0.1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foldcanvas-patch-release-authorization
          path: artifacts/m23-release-authorization
          if-no-files-found: error
          retention-days: 90

      - name: Upload minor release authorization
        if: always() && env.RELEASE_TAG == 'v1.1.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foldcanvas-minor-release-authorization
          path: artifacts/m25-release-authorization
          if-no-files-found: error
          retention-days: 90
