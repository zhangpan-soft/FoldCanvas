name: Package release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: read

jobs:
  build-package:
    name: Deterministic UPM package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate repository
        run: python3 Scripts/validate_repository.py

      - name: Validate deterministic release archive
        run: python3 Scripts/test_release_package.py

      - name: Validate M14 release-candidate contract
        run: python3 Scripts/test_release_candidate.py

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          python3 Scripts/build_release_package.py \
            --output artifacts/package "${tag_args[@]}"

      - name: Upload package and digest
        uses: actions/upload-artifact@v4.6.2
        with:
          name: foldcanvas-upm-release-candidate
          path: |
            artifacts/package/*.tgz
            artifacts/package/*.sha256
            artifacts/package/*.manifest.json
            artifacts/package/*.evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish exact RC tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release-candidate bundle
        uses: actions/download-artifact@v4.1.8
        with:
          name: foldcanvas-upm-release-candidate
          path: artifacts/package

      - name: Publish matching tagged pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            artifacts/package/*.tgz \
            artifacts/package/*.sha256 \
            artifacts/package/*.manifest.json \
            artifacts/package/*.evidence.json \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --title "FoldCanvas $GITHUB_REF_NAME"
