name: Unity Edit Mode tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unity-proof-gallery:
    name: Unity 6000.3.20f1 proof-gallery regeneration
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create clean proof-gallery host
        id: proof-inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts/m21-package
          package_version="$(jq -r '.version' package.json)"
          python3 Scripts/build_release_package.py \
            --output artifacts/m21-package \
            --tag "v$package_version"
          python3 Scripts/create_proof_gallery_project.py \
            --project artifacts/m21-proof-host-a \
            --package-archive \
            "artifacts/m21-package/com.foldcanvas.core-$package_version.tgz"
          python3 Scripts/create_proof_gallery_project.py \
            --project artifacts/m21-proof-host-b \
            --package-archive \
            "artifacts/m21-package/com.foldcanvas.core-$package_version.tgz"
          echo "generator_hash=$(sha256sum Scripts/Templates~/M21ProofGallery/Assets/FoldCanvasProofGalleryGenerator.cs | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "test_hash=$(sha256sum Scripts/Templates~/M21ProofGallery/Assets/FoldCanvasProofGalleryTests.cs | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "runner_hash=$(sha256sum Scripts/generate_proof_gallery.py | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "project_builder_hash=$(sha256sum Scripts/create_proof_gallery_project.py | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Regenerate first proof-gallery evidence
        id: unity-proof-a
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m21-proof-host-a
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m21-proof-host-a/CIArtifacts/unity-proof-gallery
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Proof Gallery
          customParameters: >-
            -testFilter
            FoldCanvas.M21Proof.FoldCanvasProofGalleryTests
            -foldCanvasProofOutput
            /github/workspace/artifacts/m21-proof-output-a
            -foldCanvasProofSourceRevision
            ${{ github.event.pull_request.head.sha || github.sha }}
            -foldCanvasProofGeneratorSha256
            ${{ steps.proof-inputs.outputs.generator_hash }}
            -foldCanvasProofTestSha256
            ${{ steps.proof-inputs.outputs.test_hash }}
            -foldCanvasProofRunnerSha256
            ${{ steps.proof-inputs.outputs.runner_hash }}
            -foldCanvasProofProjectBuilderSha256
            ${{ steps.proof-inputs.outputs.project_builder_hash }}

      # The two clean hosts intentionally run on the same GitHub runner/GPU.
      # Source/geometry/topology claims are cross-platform; raster bytes are
      # only required to repeat within one platform and graphics environment.
      - name: Regenerate second proof-gallery evidence
        id: unity-proof-b
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m21-proof-host-b
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m21-proof-host-b/CIArtifacts/unity-proof-gallery
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Proof Gallery Repeat
          customParameters: >-
            -testFilter
            FoldCanvas.M21Proof.FoldCanvasProofGalleryTests
            -foldCanvasProofOutput
            /github/workspace/artifacts/m21-proof-output-b
            -foldCanvasProofSourceRevision
            ${{ github.event.pull_request.head.sha || github.sha }}
            -foldCanvasProofGeneratorSha256
            ${{ steps.proof-inputs.outputs.generator_hash }}
            -foldCanvasProofTestSha256
            ${{ steps.proof-inputs.outputs.test_hash }}
            -foldCanvasProofRunnerSha256
            ${{ steps.proof-inputs.outputs.runner_hash }}
            -foldCanvasProofProjectBuilderSha256
            ${{ steps.proof-inputs.outputs.project_builder_hash }}

      - name: Compare regenerated proof gallery
        if: always()
        run: |
          set -euo pipefail
          python3 Scripts/compare_proof_gallery_evidence.py \
            --first artifacts/m21-proof-output-a/manifest.json \
            --second artifacts/m21-proof-output-b/manifest.json

      - name: Upload proof-gallery regeneration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-proof-gallery-evidence
          path: |
            artifacts/m21-proof-output-a
            artifacts/m21-proof-output-b
            artifacts/m21-proof-host-a/CIArtifacts/unity-proof-gallery
            artifacts/m21-proof-host-b/CIArtifacts/unity-proof-gallery
          if-no-files-found: error
          retention-days: 14

  unity-editmode-tests:
    name: Unity 6000.3.20f1 Edit Mode tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile assemblies and run Edit Mode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Project~
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: Project~/CIArtifacts/unity-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Edit Mode Tests

      - name: Normalize Unity test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_root="${{ steps.unity-tests.outputs.artifactsPath }}"
          artifact_root="artifacts/unity-editmode"

          if [[ -z "$source_root" ]]; then
            source_root="Project~/CIArtifacts/unity-editmode"
          fi

          mkdir -p "$artifact_root"

          if [[ ! -d "$source_root" ]]; then
            echo "::error::GameCI artifact directory was not created: $source_root"
            exit 1
          fi

          mapfile -t test_xml_candidates < <(
            find "$source_root" -type f \
              \( -iname '*results*.xml' -o -iname 'test-results.xml' \) \
              -print | LC_ALL=C sort
          )
          mapfile -t editor_log_candidates < <(
            find "$source_root" -type f \
              \( -iname 'editmode.log' -o -iname 'Editor.log' \) \
              -print | LC_ALL=C sort
          )

          test_xml="${test_xml_candidates[0]:-}"
          editor_log="${editor_log_candidates[0]:-}"

          if [[ -z "$test_xml" || -z "$editor_log" ]]; then
            echo "::error::Unity did not produce both test XML and Editor log."
            exit 1
          fi

          cp -- "$test_xml" "$artifact_root/test-results.xml"
          cp -- "$editor_log" "$artifact_root/Editor.log"
          cp -- \
            "Project~/M11Evidence/production-corpus-report.json" \
            "$artifact_root/production-corpus-report.json"

          test -s "$artifact_root/test-results.xml"
          test -s "$artifact_root/Editor.log"
          test -s "$artifact_root/production-corpus-report.json"

      - name: Upload Unity test results and Editor log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-results-and-logs
          path: |
            artifacts/unity-editmode/test-results.xml
            artifacts/unity-editmode/Editor.log
            artifacts/unity-editmode/production-corpus-report.json
          if-no-files-found: error
          retention-days: 14

  unity-clean-install-tests:
    name: Unity 6000.3.20f1 repeated clean archive install
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build deterministic package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_root="artifacts/m11-package"
          python3 Scripts/build_release_package.py --output "$package_root"
          mapfile -t archives < <(
            find "$package_root" -maxdepth 1 -type f -name '*.tgz' \
              -print | LC_ALL=C sort
          )
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one FoldCanvas package archive."
            exit 1
          fi
          archive="${archives[0]}"
          package_version="$(
            python3 -c 'import json; print(json.load(open("package.json"))["version"])'
          )"
          package_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "sha256=$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Generate two independent clean consumer projects
        run: |
          set -euo pipefail
          python3 Scripts/create_clean_install_project.py \
            --project artifacts/m11-clean-host-a \
            --package "${{ steps.package.outputs.archive }}"
          python3 Scripts/create_clean_install_project.py \
            --project artifacts/m11-clean-host-b \
            --package "${{ steps.package.outputs.archive }}"

      - name: Compile first consumer assembly and run clean-install tests
        id: clean-unity-tests-a
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m11-clean-host-a
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m11-clean-host-a/CIArtifacts/unity-clean-install
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Clean Archive Install A

      - name: Compile second consumer assembly and run clean-install tests
        id: clean-unity-tests-b
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m11-clean-host-b
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m11-clean-host-b/CIArtifacts/unity-clean-install
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Clean Archive Install B

      - name: Normalize, validate, and compare clean-install evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          normalize_install() {
            local install_id="$1"
            local source_root="$2"
            local project_root="artifacts/m11-clean-host-$install_id"
            local artifact_root="artifacts/m11-clean-install-$install_id"

            if [[ -z "$source_root" ]]; then
              source_root="$project_root/CIArtifacts/unity-clean-install"
            fi

            mkdir -p "$artifact_root"
            if [[ ! -d "$source_root" ]]; then
              echo "::error::Clean Unity artifact directory was not created: $source_root"
              return 1
            fi

            mapfile -t test_xml_candidates < <(
              find "$source_root" -type f \
                \( -iname '*results*.xml' -o -iname 'test-results.xml' \) \
                -print | LC_ALL=C sort
            )
            mapfile -t editor_log_candidates < <(
              find "$source_root" -type f \
                \( -iname 'editmode.log' -o -iname 'Editor.log' \) \
                -print | LC_ALL=C sort
            )

            local test_xml="${test_xml_candidates[0]:-}"
            local editor_log="${editor_log_candidates[0]:-}"
            if [[ -z "$test_xml" || -z "$editor_log" ]]; then
              echo "::error::Clean Unity run $install_id did not produce XML and Editor log."
              return 1
            fi

            cp -- "$test_xml" "$artifact_root/test-results.xml"
            cp -- "$editor_log" "$artifact_root/Editor.log"
            cp -- \
              "$project_root/M11Evidence/consumer-report.json" \
              "$artifact_root/consumer-report.json"
            cp -- \
              "$project_root/Packages/manifest.json" \
              "$artifact_root/manifest.json"
            cp -- \
              "$project_root/Packages/packages-lock.json" \
              "$artifact_root/packages-lock.json"

            python3 Scripts/validate_clean_install_evidence.py \
              --report "$artifact_root/consumer-report.json" \
              --manifest "$artifact_root/manifest.json" \
              --lock "$artifact_root/packages-lock.json" \
              --test-results "$artifact_root/test-results.xml" \
              --editor-log "$artifact_root/Editor.log" \
              --package-version "${{ steps.package.outputs.version }}" \
              --package-sha256 "${{ steps.package.outputs.sha256 }}" \
              > "$artifact_root/validation.json"
            test -s "$artifact_root/validation.json"
          }

          normalize_install \
            "a" \
            "${{ steps.clean-unity-tests-a.outputs.artifactsPath }}"
          normalize_install \
            "b" \
            "${{ steps.clean-unity-tests-b.outputs.artifactsPath }}"

          python3 Scripts/compare_clean_install_evidence.py \
            --first \
              artifacts/m11-clean-install-a/consumer-report.json \
            --second \
              artifacts/m11-clean-install-b/consumer-report.json \
            > artifacts/m11-clean-install-comparison.json
          test -s artifacts/m11-clean-install-comparison.json

      - name: Upload clean-install results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-clean-install-results-and-logs
          path: |
            artifacts/m11-clean-install-a/test-results.xml
            artifacts/m11-clean-install-a/Editor.log
            artifacts/m11-clean-install-a/consumer-report.json
            artifacts/m11-clean-install-a/manifest.json
            artifacts/m11-clean-install-a/packages-lock.json
            artifacts/m11-clean-install-a/validation.json
            artifacts/m11-clean-install-b/test-results.xml
            artifacts/m11-clean-install-b/Editor.log
            artifacts/m11-clean-install-b/consumer-report.json
            artifacts/m11-clean-install-b/manifest.json
            artifacts/m11-clean-install-b/packages-lock.json
            artifacts/m11-clean-install-b/validation.json
            artifacts/m11-clean-install-comparison.json
          if-no-files-found: error
          retention-days: 14

  unity-production-handoff-tests:
    name: Unity 6000.3.20f1 clean producer and receiver handoff
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build deterministic package archive
        id: handoff-package
        shell: bash
        run: |
          set -euo pipefail
          package_root="artifacts/m12-package"
          python3 Scripts/build_release_package.py --output "$package_root"
          mapfile -t archives < <(
            find "$package_root" -maxdepth 1 -type f -name '*.tgz' \
              -print | LC_ALL=C sort
          )
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one FoldCanvas package archive."
            exit 1
          fi
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate independent producer and receiver projects
        run: |
          set -euo pipefail
          python3 Scripts/create_handoff_proof_projects.py \
            --producer artifacts/m12-handoff-producer \
            --receiver artifacts/m12-handoff-receiver \
            --package "${{ steps.handoff-package.outputs.archive }}"

      - name: Export production cup in clean producer
        id: handoff-producer-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m12-handoff-producer
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m12-handoff-producer/CIArtifacts/unity-handoff-producer
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Production Handoff Producer

      - name: Transfer only the handoff archive to receiver
        run: |
          set -euo pipefail
          archive="artifacts/m12-handoff-producer/M12Evidence/production-cup.foldcanvas.zip"
          test -s "$archive"
          cp -- \
            "$archive" \
            artifacts/m12-handoff-receiver/M12Input/production-cup.foldcanvas.zip

      - name: Import and rebuild in clean receiver
        id: handoff-receiver-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m12-handoff-receiver
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m12-handoff-receiver/CIArtifacts/unity-handoff-receiver
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Production Handoff Receiver

      - name: Normalize and compare handoff evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          normalize_unity() {
            local role="$1"
            local source_root="$2"
            local fallback="artifacts/m12-handoff-$role/CIArtifacts/unity-handoff-$role"
            local output="artifacts/m12-handoff/$role"
            if [[ -z "$source_root" ]]; then
              source_root="$fallback"
            fi
            mkdir -p "$output"
            if [[ ! -d "$source_root" ]]; then
              echo "::error::Missing GameCI handoff artifact directory: $source_root"
              return 1
            fi
            mapfile -t xmls < <(
              find "$source_root" -type f \
                \( -iname '*results*.xml' -o -iname 'test-results.xml' \) \
                -print | LC_ALL=C sort
            )
            mapfile -t logs < <(
              find "$source_root" -type f \
                \( -iname 'editmode.log' -o -iname 'Editor.log' \) \
                -print | LC_ALL=C sort
            )
            test -n "${xmls[0]:-}"
            test -n "${logs[0]:-}"
            cp -- "${xmls[0]}" "$output/test-results.xml"
            cp -- "${logs[0]}" "$output/Editor.log"
          }

          normalize_unity \
            producer \
            "${{ steps.handoff-producer-tests.outputs.artifactsPath }}"
          normalize_unity \
            receiver \
            "${{ steps.handoff-receiver-tests.outputs.artifactsPath }}"

          cp -- \
            artifacts/m12-handoff-producer/M12Evidence/production-cup.foldcanvas.zip \
            artifacts/m12-handoff/production-cup.foldcanvas.zip
          cp -- \
            artifacts/m12-handoff-producer/M12Evidence/producer-report.json \
            artifacts/m12-handoff/producer-report.json
          cp -- \
            artifacts/m12-handoff-producer/M12Evidence/compile-report.json \
            artifacts/m12-handoff/compile-report.json
          cp -- \
            artifacts/m12-handoff-receiver/M12Evidence/receiver-report.json \
            artifacts/m12-handoff/receiver-report.json
          cp -- \
            artifacts/m12-handoff-receiver/M12Evidence/handoff-receipt.json \
            artifacts/m12-handoff/handoff-receipt.json
          cp -- \
            artifacts/m12-handoff-receiver/M12Evidence/source.foldcanvas.json \
            artifacts/m12-handoff/source.foldcanvas.json

          python3 Scripts/compare_handoff_evidence.py \
            --producer artifacts/m12-handoff/producer-report.json \
            --receiver artifacts/m12-handoff/receiver-report.json \
            --archive artifacts/m12-handoff/production-cup.foldcanvas.zip \
            --receipt artifacts/m12-handoff/handoff-receipt.json \
            --source artifacts/m12-handoff/source.foldcanvas.json \
            --output artifacts/m12-handoff/comparison.json

          find artifacts/m12-handoff -type f -maxdepth 2 -print0 | \
            xargs -0 -n1 test -s

      - name: Upload production handoff results and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-production-handoff-results-and-evidence
          path: |
            artifacts/m12-handoff/producer/test-results.xml
            artifacts/m12-handoff/producer/Editor.log
            artifacts/m12-handoff/receiver/test-results.xml
            artifacts/m12-handoff/receiver/Editor.log
            artifacts/m12-handoff/production-cup.foldcanvas.zip
            artifacts/m12-handoff/producer-report.json
            artifacts/m12-handoff/receiver-report.json
            artifacts/m12-handoff/compile-report.json
            artifacts/m12-handoff/handoff-receipt.json
            artifacts/m12-handoff/source.foldcanvas.json
            artifacts/m12-handoff/comparison.json
          if-no-files-found: error
          retention-days: 14

  unity-source-upgrade-tests:
    name: Unity 6000.3.20f1 source-first package upgrade
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository with rollback history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build rollback and current archives, then create upgrade host
        id: upgrade-input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/m15-upgrade-pr
          baseline_commit="$(
            jq -r '.upgrade.fixture.baselineGitCommit' \
              Documentation~/m25-minor-release.json
          )"
          baseline_root="$RUNNER_TEMP/foldcanvas-m15-pr-baseline"
          git worktree add --detach "$baseline_root" "$baseline_commit"
          python3 "$baseline_root/Scripts/build_release_package.py" \
            --output "$GITHUB_WORKSPACE/artifacts/m15-upgrade-pr-baseline-package"
          python3 Scripts/build_release_package.py \
            --output artifacts/m15-upgrade-pr-candidate-package
          mapfile -t baseline_archives < <(
            find artifacts/m15-upgrade-pr-baseline-package \
              -type f -name '*.tgz' -print | LC_ALL=C sort
          )
          mapfile -t candidate_archives < <(
            find artifacts/m15-upgrade-pr-candidate-package \
              -type f -name '*.tgz' -print | LC_ALL=C sort
          )
          if [[ "${#baseline_archives[@]}" -ne 1 || \
                "${#candidate_archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one baseline and candidate archive."
            exit 1
          fi
          python3 Scripts/create_upgrade_proof_project.py \
            --project artifacts/m15-upgrade-pr-host \
            --package "${baseline_archives[0]}" \
            --source "$baseline_root/Samples~/BootstrapPanel/m12-production-cup.foldcanvas.json" \
            --appearance "$baseline_root/Samples~/BootstrapPanel/M04ProductionCupCanvas.png"
          cp -- artifacts/m15-upgrade-pr-host/M15Expected.json \
            artifacts/m15-upgrade-pr/before-expected.json
          echo "baseline_version=$(jq -r '.packageVersion' artifacts/m15-upgrade-pr-host/M15Expected.json)" \
            >> "$GITHUB_OUTPUT"
          echo "baseline_sha256=$(jq -r '.packageSha256' artifacts/m15-upgrade-pr-host/M15Expected.json)" \
            >> "$GITHUB_OUTPUT"
          echo "candidate_archive=${candidate_archives[0]}" \
            >> "$GITHUB_OUTPUT"
          echo "candidate_version=$(jq -r '.version' package.json)" \
            >> "$GITHUB_OUTPUT"
          candidate_sha256="$(
            sha256sum "${candidate_archives[0]}" | cut -d' ' -f1
          )"
          echo "candidate_sha256=$candidate_sha256" >> "$GITHUB_OUTPUT"

      - name: Compile source with rollback package
        id: upgrade-before-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m15-upgrade-pr-host
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m15-upgrade-pr-host/CIArtifacts/unity-upgrade-before
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Source Upgrade Before Stable

      - name: Normalize and validate rollback phase
        shell: bash
        run: |
          set -euo pipefail
          source_root="${{ steps.upgrade-before-tests.outputs.artifactsPath }}"
          if [[ -z "$source_root" ]]; then
            source_root="artifacts/m15-upgrade-pr-host/CIArtifacts/unity-upgrade-before"
          fi
          output_root="artifacts/m15-upgrade-pr/before"
          mkdir -p "$output_root"
          mapfile -t xmls < <(
            find "$source_root" -type f \
              \( -iname '*results*.xml' -o -iname 'test-results.xml' \) \
              -print | LC_ALL=C sort
          )
          mapfile -t logs < <(
            find "$source_root" -type f \
              \( -iname 'editmode.log' -o -iname 'Editor.log' \) \
              -print | LC_ALL=C sort
          )
          test -n "${xmls[0]:-}"
          test -n "${logs[0]:-}"
          cp -- "${xmls[0]}" "$output_root/test-results.xml"
          cp -- "${logs[0]}" "$output_root/Editor.log"
          cp -- artifacts/m15-upgrade-pr-host/M15Evidence/before.json \
            "$output_root/report.json"
          cp -- artifacts/m15-upgrade-pr-host/Packages/manifest.json \
            "$output_root/manifest.json"
          cp -- artifacts/m15-upgrade-pr-host/Packages/packages-lock.json \
            "$output_root/packages-lock.json"
          python3 Scripts/validate_upgrade_evidence.py \
            --phase before \
            --report "$output_root/report.json" \
            --manifest "$output_root/manifest.json" \
            --lock "$output_root/packages-lock.json" \
            --test-results "$output_root/test-results.xml" \
            --editor-log "$output_root/Editor.log" \
            --package-version "${{ steps.upgrade-input.outputs.baseline_version }}" \
            --package-sha256 "${{ steps.upgrade-input.outputs.baseline_sha256 }}" \
            > "$output_root/validation.json"

      - name: Replace package and clear owned derived state
        shell: bash
        run: |
          set -euo pipefail
          # GameCI runs Unity in a container, so its derived project state can
          # be owned by root on the Linux runner. This host is generated and
          # marked as FoldCanvas-owned before Unity starts.
          sudo chown -R -- "$(id -u):$(id -g)" artifacts/m15-upgrade-pr-host
          python3 Scripts/advance_upgrade_proof_project.py \
            --project artifacts/m15-upgrade-pr-host \
            --package "${{ steps.upgrade-input.outputs.candidate_archive }}" \
            > artifacts/m15-upgrade-pr/transition.json
          cp -- artifacts/m15-upgrade-pr-host/M15Expected.json \
            artifacts/m15-upgrade-pr/after-expected.json

      - name: Recompile unchanged source with stable package
        id: upgrade-after-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: artifacts/m15-upgrade-pr-host
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/m15-upgrade-pr-host/CIArtifacts/unity-upgrade-after
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Source Upgrade Stable

      - name: Validate and compare stable phase
        shell: bash
        run: |
          set -euo pipefail
          source_root="${{ steps.upgrade-after-tests.outputs.artifactsPath }}"
          if [[ -z "$source_root" ]]; then
            source_root="artifacts/m15-upgrade-pr-host/CIArtifacts/unity-upgrade-after"
          fi
          output_root="artifacts/m15-upgrade-pr/after"
          mkdir -p "$output_root"
          mapfile -t xmls < <(
            find "$source_root" -type f \
              \( -iname '*results*.xml' -o -iname 'test-results.xml' \) \
              -print | LC_ALL=C sort
          )
          mapfile -t logs < <(
            find "$source_root" -type f \
              \( -iname 'editmode.log' -o -iname 'Editor.log' \) \
              -print | LC_ALL=C sort
          )
          test -n "${xmls[0]:-}"
          test -n "${logs[0]:-}"
          cp -- "${xmls[0]}" "$output_root/test-results.xml"
          cp -- "${logs[0]}" "$output_root/Editor.log"
          cp -- artifacts/m15-upgrade-pr-host/M15Evidence/after.json \
            "$output_root/report.json"
          cp -- artifacts/m15-upgrade-pr-host/Packages/manifest.json \
            "$output_root/manifest.json"
          cp -- artifacts/m15-upgrade-pr-host/Packages/packages-lock.json \
            "$output_root/packages-lock.json"
          python3 Scripts/validate_upgrade_evidence.py \
            --phase after \
            --report "$output_root/report.json" \
            --manifest "$output_root/manifest.json" \
            --lock "$output_root/packages-lock.json" \
            --test-results "$output_root/test-results.xml" \
            --editor-log "$output_root/Editor.log" \
            --package-version "${{ steps.upgrade-input.outputs.candidate_version }}" \
            --package-sha256 "${{ steps.upgrade-input.outputs.candidate_sha256 }}" \
            > "$output_root/validation.json"
          python3 Scripts/compare_upgrade_evidence.py \
            --before artifacts/m15-upgrade-pr/before/report.json \
            --after "$output_root/report.json" \
            --contract Documentation~/m25-minor-release.json \
            --output artifacts/m15-upgrade-pr/comparison.json

      - name: Upload pre-release source-upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-source-upgrade-pre-release-results-and-logs
          path: |
            artifacts/m15-upgrade-pr/before/test-results.xml
            artifacts/m15-upgrade-pr/before/Editor.log
            artifacts/m15-upgrade-pr/before/report.json
            artifacts/m15-upgrade-pr/before/manifest.json
            artifacts/m15-upgrade-pr/before/packages-lock.json
            artifacts/m15-upgrade-pr/before/validation.json
            artifacts/m15-upgrade-pr/after/test-results.xml
            artifacts/m15-upgrade-pr/after/Editor.log
            artifacts/m15-upgrade-pr/after/report.json
            artifacts/m15-upgrade-pr/after/manifest.json
            artifacts/m15-upgrade-pr/after/packages-lock.json
            artifacts/m15-upgrade-pr/after/validation.json
            artifacts/m15-upgrade-pr/before-expected.json
            artifacts/m15-upgrade-pr/after-expected.json
            artifacts/m15-upgrade-pr/transition.json
            artifacts/m15-upgrade-pr/comparison.json
          if-no-files-found: error
          retention-days: 14
