name: Unity Edit Mode tests

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  unity-editmode-tests:
    name: Unity 6000.3.20f1 Edit Mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Compile assemblies and run Edit Mode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Project~
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/unity-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Edit Mode Tests

      - name: Normalize Unity test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="artifacts/unity-editmode"
          mkdir -p "$artifact_root"

          test_xml="$(find "$artifact_root" -type f \( -iname '*results*.xml' -o -iname 'test-results.xml' \) | LC_ALL=C sort | head -n 1)"
          editor_log="$(find "$artifact_root" -type f \( -iname 'editmode.log' -o -iname 'Editor.log' \) | LC_ALL=C sort | head -n 1)"

          if [[ -z "$test_xml" || -z "$editor_log" ]]; then
            echo "::error::Unity did not produce both test XML and Editor log."
            exit 1
          fi

          if [[ "$test_xml" != "$artifact_root/test-results.xml" ]]; then
            cp "$test_xml" "$artifact_root/test-results.xml"
          fi
          if [[ "$editor_log" != "$artifact_root/Editor.log" ]]; then
            cp "$editor_log" "$artifact_root/Editor.log"
          fi

      - name: Upload Unity test results and Editor log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unity-editmode-results-and-logs
          path: |
            artifacts/unity-editmode/test-results.xml
            artifacts/unity-editmode/Editor.log
          if-no-files-found: error
          retention-days: 14
