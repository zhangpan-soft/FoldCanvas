name: Unity Edit Mode tests

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  unity-editmode-tests:
    name: Unity 6000.3.20f1 Edit Mode tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Compile assemblies and run Edit Mode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Project~
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: artifacts/unity-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FoldCanvas Edit Mode Tests

      - name: Preserve Unity Editor log name
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/unity-editmode/editmode.log ]]; then
            cp artifacts/unity-editmode/editmode.log artifacts/unity-editmode/Editor.log
          fi

      - name: Upload Unity test results and Editor log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unity-editmode-results-and-logs
          path: artifacts/unity-editmode
          if-no-files-found: warn
