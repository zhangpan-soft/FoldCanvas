<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1180"
     viewBox="0 0 1600 1180"
     role="img"
     aria-labelledby="diagram-title diagram-description"
     data-contract-version="1">
  <title id="diagram-title">FoldCanvas Roll handedness / Roll 坐标与绕序</title>
  <desc id="diagram-description">Source-frame, Roll-U, and Roll-V cross-sections derived from theta equals startAngleDegrees minus t times angleDegrees.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1180" fill="#f8fafc"/>
  <text x="60" y="58" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#0f172a">FoldCanvas Roll handedness / Roll 坐标与绕序</text>
  <text x="60" y="93" font-family="system-ui, sans-serif" font-size="19" fill="#475569">Exact orthographic review of the selected-axis / CurrentNormal cross-section · 选择轴与 CurrentNormal 的正交截面</text>

  <g id="source-frame" data-front-normal="CurrentNormal" data-boundary-order="uMin:bottom-to-top;uMax:bottom-to-top;vMin:left-to-right;vMax:left-to-right">
    <rect x="50" y="125" width="370" height="350" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="75" y="165" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. Current planar source / 当前平面源</text>
    <rect x="110" y="220" width="250" height="160" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <line x1="130" y1="300" x2="325" y2="300" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="185" y="288" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">source +U / UV reads →</text>
    <text x="92" y="207" font-family="system-ui, sans-serif" font-size="16" fill="#7c3aed">vMax</text>
    <text x="92" y="404" font-family="system-ui, sans-serif" font-size="16" fill="#7c3aed">vMin</text>
    <text x="60" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#0f766e">uMin</text>
    <text x="365" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#0f766e">uMax</text>
    <line x1="235" y1="420" x2="330" y2="420" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="335" y="427" font-family="system-ui, sans-serif" font-size="17" fill="#1d4ed8">CurrentU</text>
    <line x1="235" y1="420" x2="235" y2="348" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="245" y="365" font-family="system-ui, sans-serif" font-size="17" fill="#166534">CurrentV</text>
    <circle cx="140" cy="447" r="17" fill="none" stroke="#ea580c" stroke-width="3"/>
    <circle cx="140" cy="447" r="5" fill="#ea580c"/>
    <text x="165" y="454" font-family="system-ui, sans-serif" font-size="15" fill="#c2410c">CurrentNormal = U × V</text>
    <text x="110" y="250" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">FRONT / 正面</text>
  </g>

  <g id="roll-u-positive"
     data-direction="u"
     data-cylinder-axis="CurrentV"
     data-selected-axis="CurrentU"
     data-angle-degrees="+360"
     data-start-angle-degrees="0"
     data-theta-degrees-expression="startAngleDegrees - t * angleDegrees"
     data-min-radial="-CurrentU"
     data-quarter-radial="-CurrentNormal"
     data-radial-orientation="outward">
    <rect x="450" y="125" width="340" height="350" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="475" y="165" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Roll-U · +360°</text>
    <text x="475" y="193" font-family="system-ui, sans-serif" font-size="16" fill="#475569">axis = CurrentV · selected = CurrentU</text>
    <circle cx="620" cy="315" r="92" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
    <line x1="505" y1="315" x2="755" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="690" y="305" font-family="system-ui, sans-serif" font-size="15" fill="#1d4ed8">+CurrentU</text>
    <line x1="620" y1="430" x2="620" y2="205" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="610" y="220" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c">+CurrentNormal</text>
    <polyline points="528,315 542,365 570,394 620,407" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <circle cx="528" cy="315" r="7" fill="#0f766e"/>
    <circle cx="528" cy="315" r="12" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="472" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">t=0 uMin</text>
    <text x="475" y="309" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">t=1 uMax</text>
    <text x="625" y="402" font-family="system-ui, sans-serif" font-size="14" fill="#1d4ed8">t=.25 = −Normal</text>
    <line x1="712" y1="315" x2="765" y2="315" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
    <text x="675" y="355" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#166534">radial OUT</text>
    <text x="475" y="450" font-family="system-ui, sans-serif" font-size="15" fill="#475569">min/max coincide in position, not topology</text>
    <circle cx="735" cy="215" r="15" fill="none" stroke="#15803d" stroke-width="3"/>
    <circle cx="735" cy="215" r="4" fill="#15803d"/>
    <text x="710" y="247" font-family="system-ui, sans-serif" font-size="13" fill="#166534">+CurrentV axis</text>
  </g>

  <g id="roll-u-negative"
     data-direction="u"
     data-cylinder-axis="CurrentV"
     data-selected-axis="CurrentU"
     data-angle-degrees="-360"
     data-start-angle-degrees="0"
     data-theta-degrees-expression="startAngleDegrees - t * angleDegrees"
     data-min-radial="-CurrentU"
     data-quarter-radial="+CurrentNormal"
     data-radial-orientation="inward">
    <rect x="810" y="125" width="340" height="350" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <text x="835" y="165" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#c2410c">Roll-U · −360°</text>
    <text x="835" y="193" font-family="system-ui, sans-serif" font-size="16" fill="#475569">axis = CurrentV · selected = CurrentU</text>
    <circle cx="980" cy="315" r="92" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
    <line x1="865" y1="315" x2="1115" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="1050" y="305" font-family="system-ui, sans-serif" font-size="15" fill="#1d4ed8">+CurrentU</text>
    <line x1="980" y1="430" x2="980" y2="205" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="970" y="220" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c">+CurrentNormal</text>
    <polyline points="888,315 902,265 930,236 980,223" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#arrow-orange)"/>
    <circle cx="888" cy="315" r="7" fill="#0f766e"/>
    <circle cx="888" cy="315" r="12" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="832" y="338" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">uMin / uMax</text>
    <text x="985" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#c2410c">t=.25 = +Normal</text>
    <line x1="1135" y1="315" x2="1078" y2="315" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
    <text x="1032" y="355" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">radial IN</text>
    <text x="835" y="450" font-family="system-ui, sans-serif" font-size="15" fill="#475569">opposite circulation · documented inward front</text>
    <circle cx="1095" cy="215" r="15" fill="none" stroke="#15803d" stroke-width="3"/>
    <circle cx="1095" cy="215" r="4" fill="#15803d"/>
    <text x="1075" y="247" font-family="system-ui, sans-serif" font-size="13" fill="#166534">+V axis</text>
  </g>

  <g id="roll-v-positive"
     data-direction="v"
     data-cylinder-axis="CurrentU"
     data-selected-axis="CurrentV"
     data-angle-degrees="+360"
     data-start-angle-degrees="0"
     data-theta-degrees-expression="startAngleDegrees - t * angleDegrees"
     data-min-radial="-CurrentV"
     data-quarter-radial="-CurrentNormal"
     data-radial-orientation="outward">
    <rect x="450" y="500" width="340" height="350" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <text x="475" y="540" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#166534">Roll-V · +360°</text>
    <text x="475" y="568" font-family="system-ui, sans-serif" font-size="16" fill="#475569">axis = CurrentU · selected = CurrentV</text>
    <circle cx="620" cy="690" r="92" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/>
    <line x1="505" y1="690" x2="755" y2="690" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="690" y="680" font-family="system-ui, sans-serif" font-size="15" fill="#166534">+CurrentV</text>
    <line x1="620" y1="805" x2="620" y2="580" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="610" y="595" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c">+CurrentNormal</text>
    <polyline points="528,690 542,740 570,769 620,782" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
    <circle cx="528" cy="690" r="7" fill="#7c3aed"/>
    <circle cx="528" cy="690" r="12" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="472" y="665" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">t=0 vMin</text>
    <text x="475" y="684" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">t=1 vMax</text>
    <text x="625" y="777" font-family="system-ui, sans-serif" font-size="14" fill="#166534">t=.25 = −Normal</text>
    <line x1="712" y1="690" x2="765" y2="690" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
    <text x="675" y="730" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#166534">radial OUT</text>
    <circle cx="735" cy="590" r="15" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="735" cy="590" r="4" fill="#2563eb"/>
    <text x="710" y="622" font-family="system-ui, sans-serif" font-size="13" fill="#1d4ed8">+CurrentU axis</text>
    <text x="475" y="825" font-family="system-ui, sans-serif" font-size="15" fill="#475569">uMin/uMax remain the cylinder end boundaries</text>
  </g>

  <g id="roll-v-negative"
     data-direction="v"
     data-cylinder-axis="CurrentU"
     data-selected-axis="CurrentV"
     data-angle-degrees="-360"
     data-start-angle-degrees="0"
     data-theta-degrees-expression="startAngleDegrees - t * angleDegrees"
     data-min-radial="-CurrentV"
     data-quarter-radial="+CurrentNormal"
     data-radial-orientation="inward">
    <rect x="810" y="500" width="340" height="350" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="3"/>
    <text x="835" y="540" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">Roll-V · −360°</text>
    <text x="835" y="568" font-family="system-ui, sans-serif" font-size="16" fill="#475569">axis = CurrentU · selected = CurrentV</text>
    <circle cx="980" cy="690" r="92" fill="#fef2f2" stroke="#64748b" stroke-width="2"/>
    <line x1="865" y1="690" x2="1115" y2="690" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="1050" y="680" font-family="system-ui, sans-serif" font-size="15" fill="#166534">+CurrentV</text>
    <line x1="980" y1="805" x2="980" y2="580" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="970" y="595" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#c2410c">+CurrentNormal</text>
    <polyline points="888,690 902,640 930,611 980,598" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
    <circle cx="888" cy="690" r="7" fill="#7c3aed"/>
    <circle cx="888" cy="690" r="12" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="832" y="713" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">vMin / vMax</text>
    <text x="985" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#b91c1c">t=.25 = +Normal</text>
    <line x1="1135" y1="690" x2="1078" y2="690" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
    <text x="1032" y="730" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">radial IN</text>
    <circle cx="1095" cy="590" r="15" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="1095" cy="590" r="4" fill="#2563eb"/>
    <text x="1075" y="622" font-family="system-ui, sans-serif" font-size="13" fill="#1d4ed8">+U axis</text>
    <text x="835" y="825" font-family="system-ui, sans-serif" font-size="15" fill="#475569">opposite circulation · documented inward front</text>
  </g>

  <g id="evidence-legend">
    <rect x="1170" y="125" width="380" height="725" rx="18" fill="#0f172a"/>
    <text x="1200" y="168" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Reading the proof / 如何读图</text>
    <text x="1200" y="210" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">POSITION / 位置</text>
    <text x="1200" y="238" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">θdeg(t) = startAngleDegrees</text>
    <text x="1200" y="261" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">          − t × angleDegrees</text>
    <text x="1200" y="284" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">θ = radians(θdeg)</text>
    <text x="1200" y="310" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">+ sweep: first quarter → −Normal</text>
    <text x="1200" y="334" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">− sweep: first quarter → +Normal</text>

    <text x="1200" y="365" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#86efac">WINDING / 三角形绕序</text>
    <line x1="1210" y1="399" x2="1270" y2="399" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
    <text x="1285" y="405" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">+ full turn = radial OUT</text>
    <line x1="1270" y1="433" x2="1210" y2="433" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
    <text x="1285" y="439" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">− full turn = radial IN</text>
    <text x="1200" y="470" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Roll reverses each source triangle once.</text>

    <text x="1200" y="518" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#fde68a">UV / 贴图方向</text>
    <rect x="1200" y="540" width="320" height="72" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="1220" y="570" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">canonical +Roll-U, start = 180°</text>
    <text x="1220" y="597" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#93c5fd">lower U  A  →  B  higher U</text>
    <text x="1200" y="640" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Exterior view reads increasing source U</text>
    <text x="1200" y="662" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">left-to-right; UV0 itself is unchanged.</text>

    <text x="1200" y="710" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#fca5a5">MATERIAL / 材质</text>
    <text x="1200" y="741" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">Cull Off / two-sided only shows both sides.</text>
    <text x="1200" y="766" font-family="system-ui, sans-serif" font-size="15" fill="#fecaca">It does NOT repair winding or normals.</text>

    <text x="1200" y="812" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Evidence: RollCompilerTests + documented formula</text>
  </g>

  <g id="formula-footer" data-degrees-formula="thetaDegrees = startAngleDegrees - t * angleDegrees" data-radians-formula="thetaRadians = radians(thetaDegrees)">
    <rect x="50" y="880" width="1500" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="80" y="925" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">2. Exact mapping / 精确映射</text>
    <text x="80" y="963" font-family="ui-monospace, monospace" font-size="18" fill="#1e293b">thetaDegrees = startAngleDegrees - t * angleDegrees; theta = radians(thetaDegrees)</text>
    <text x="80" y="997" font-family="ui-monospace, monospace" font-size="17" fill="#1e293b">Roll-U: P = O + y·V - R·cos(theta)·U + R·sin(theta)·Normal</text>
    <text x="80" y="1029" font-family="ui-monospace, monospace" font-size="17" fill="#1e293b">Roll-V: P = O + x·U - R·cos(theta)·V + R·sin(theta)·Normal</text>
    <text x="80" y="1070" font-family="system-ui, sans-serif" font-size="16" fill="#475569">Green outward / red inward arrows are geometric front orientation. Blue/orange sweep arrows are parameter motion. They are independent of material culling.</text>
    <text x="80" y="1100" font-family="system-ui, sans-serif" font-size="16" fill="#475569">绿色/红色表示几何正面朝向；蓝色/橙色表示参数扫掠方向。二者都不由双面材质重新定义。</text>
  </g>
</svg>
